<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Archiv für Lifesaving-Wettkämpfe und Ergebnisse.">
    <meta name="theme-color" content="#f7f8fa">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Lifesaving Ergebnisarchiv</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script defer src="vendor/sql.js/sql-wasm.js"></script>
    <script defer src="app.js?v=4"></script>
  </head>
  <body>
    <a class="skip-link" href="#inhalt">Zum Inhalt</a>
    <header class="site-header">
      <div class="frame">
        <a class="brand" href="#/">Lifesaving<span> / Archiv</span></a>
      </div>
    </header>
    <main class="frame" id="inhalt" tabindex="-1">
      <div class="load-state" id="loading-view" role="status">
        <span>Datenbank wird geladen …</span>
        <progress id="loading-progress" aria-label="Downloadfortschritt"></progress>
      </div>
      <div id="app-view" hidden></div>
      <noscript>Für das Ergebnisarchiv ist JavaScript erforderlich.</noscript>
    </main>
  </body>
</html>
